<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5ef"><meta name="description" content="Simple daily calories, protein and weight. Your data stays on your device."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.png"><title>Daily · Macros & Weight</title><link rel="stylesheet" href="style.css?v=5"></head><body>
<main><header><div class="brand"><span class="mark">d.</span><span>daily<span class="brand-dot">.</span></span></div></header>
<section id="macro-page"><div class="day-picker"><button id="prev-day" aria-label="Previous day">‹</button><label><span id="day-label">Today</span><input id="macro-date" type="date" aria-label="Macro date"></label><button id="next-day" aria-label="Next day">›</button></div>
<div class="totals"><div class="total green"><span>Calories</span><strong id="cal-total">0</strong><small>kcal</small><span class="total-symbol">✳</span></div><div class="total white"><span>Protein</span><strong id="protein-total">0<span> g</span></strong><span class="total-symbol">◒</span></div></div>
<section class="card"><div class="card-title"><h2>Log macros</h2></div><form id="macro-form"><label>Meal name <span class="muted">(optional)</span><input id="entry-name" maxlength="120"></label><div class="fields"><label>Calories <div class="input-unit"><input id="entry-cal" type="number" inputmode="decimal" min="0" max="100000" step="any" placeholder="0"><span>kcal</span></div></label><label>Protein <div class="input-unit"><input id="entry-protein" type="number" inputmode="decimal" min="0" max="10000" step="any" placeholder="0"><span>g</span></div></label></div><button class="primary" type="submit">＋ <span id="log-label">Add to today</span></button></form></section>
<section class="card"><div class="card-title"><div><h2>Frequent meals</h2></div><button class="text-button" id="new-meal">＋ Add</button></div><div id="meals"></div></section>
<section class="card"><div class="card-title"><h2 id="entries-title">Today's log</h2><span class="count" id="entry-count">0 entries</span></div><div id="entries"></div></section>
<section class="card"><div class="card-title"><h2>History</h2></div><div id="macro-history"></div></section></section>
<section id="weight-page" hidden>
<section class="card"><div class="card-title"><h2>Weigh-in</h2></div><form id="weight-form"><div class="fields"><label>Date<input id="weight-date" type="date" required></label><label>Weight<div class="input-unit"><input id="weight-input" type="number" inputmode="decimal" min="0.1" max="2000" step="any" placeholder="160" required><span>lb</span></div></label></div><button class="primary">＋ Save weigh-in</button></form></section>
<section class="card trend-card"><div class="card-title"><h2 title="Average weekly change from a best-fit line across the selected period">Weekly change</h2><select id="trend-range" aria-label="Weekly change period"></select></div><div class="trend-value" id="trend-value">—<span> lb / week</span></div><p id="trend-detail" class="muted">Needs 2 weigh-ins.</p></section>
<section class="card"><div class="card-title"><h2>Weight history</h2><div class="view-toggle"><button id="graph-view" class="active" aria-pressed="true">Graph</button><button id="table-view" aria-pressed="false">Table</button></div></div><div id="graph-panel"><div class="chart-top"><span class="muted">lb</span><select id="chart-range" aria-label="Graph date range"></select></div><div id="chart"></div></div><div id="weight-table" hidden></div></section></section>
</main>
<nav class="bottom-nav" aria-label="Pages"><span id="nav-pill"></span><button id="macro-tab" class="active" aria-current="page">◒ &nbsp; Macro</button><button id="weight-tab">⌁ &nbsp; Weight</button></nav>
<div class="data-tools"><div id="data-menu" hidden><h3>Data</h3><button id="export-json">↓ Export JSON</button><button id="export-csv">↓ Export CSV</button><button id="import-button">↑ Import data</button><p>Saved on this device.</p></div><button id="tools-toggle" aria-label="Import and export data" aria-expanded="false">⇅</button><input id="import-file" type="file" accept=".json,.csv,application/json,text/csv" hidden></div>
<dialog id="meal-dialog"><form id="meal-form"><div class="card-title"><h2>Frequent meal</h2><button class="icon-button" type="button" id="close-meal" aria-label="Close">×</button></div><label>Meal name<input id="meal-name" required maxlength="120" placeholder="Chocolate milk"></label><div class="fields"><label>Calories<input id="meal-cal" type="number" min="0" max="100000" step="any" inputmode="decimal" required placeholder="0"></label><label>Protein (g)<input id="meal-protein" type="number" min="0" max="10000" step="any" inputmode="decimal" required placeholder="0"></label></div><button class="primary">Save meal</button></form></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.mjs?v=5"></script></body></html>
